/* Layout: sticky 3:1 preview on top, tabbed control panels below */
:root{
  --bg:#f5f0f3; --panel:#ffffff; --field:#faf6f8; --ink:#2a1f26; --muted:#7f6c78;
  --line:#e7dbe2; --accent:#b0346a; --accent-ink:#ffffff; --accent-soft:#f6dce8;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161117; --panel:#201921; --field:#1a141c; --ink:#f3e9ef; --muted:#a8949f;
  --line:#352a35; --accent:#f27aa9; --accent-ink:#2a0d1a; --accent-soft:#3a2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161117; --panel:#201921; --field:#1a141c; --ink:#f3e9ef; --muted:#a8949f;
  --line:#352a35; --accent:#f27aa9; --accent-ink:#2a0d1a; --accent-soft:#3a2230; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:1072px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:18px}
.badge{position:relative;display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px;letter-spacing:-.01em;padding:9px 18px;border-radius:24px;margin:0 0 4px 8px}
.badge::after{content:"";position:absolute;left:-9px;bottom:0;width:22px;height:18px;background:var(--accent);clip-path:path("M22 0 C 21 9, 14 15, 0 18 C 9 18.5, 17 16, 22 11 Z")}
.top p{margin:0;color:var(--muted);font-size:13.5px;max-width:60ch}

.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px}
.stage-in{width:min(100%,max(600px,calc((100vh - 400px)*3)));margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.shell{background:var(--bg)}
.canvas-wrap{position:relative;aspect-ratio:3/1;width:100%;max-width:100%;border-radius:14px;overflow:hidden;background:#0d0a0d;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(60,20,40,.45)}
.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.canvas-wrap canvas:active{cursor:grabbing}
.canvas-wrap.drop{outline:3px dashed var(--accent);outline-offset:-6px}
@media (max-width:760px){
  .stage,.stage-in{display:contents}
  .shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px}
  .toolbar{margin-top:4px}
}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .spacer{flex:1 1 auto}
.hint{margin:0;color:var(--muted);font-size:12.5px}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;padding:10px 14px 11px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1 1 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;min-width:0}
.blocks{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));align-items:start}
.blk{display:grid;gap:12px;min-width:0;align-content:start}
.panel h3{margin:0 0 -4px;font-size:12.5px;font-weight:600;color:var(--accent)}
.sub{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--field);border:1px solid var(--line)}

.field{display:grid;gap:6px;min-width:0}
.field>.lab{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.field output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
